<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lab Bilangan Bulat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1e272e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            color: white;
            overflow: hidden;
        }

        .app-container {
            background: #2d3436;
            width: 100%;
            max-width: 480px;
            height: 95vh;
            max-height: 850px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER & TABS --- */
        .header {
            background: #0984e3;
            padding: 10px;
            text-align: center;
            flex-shrink: 0;
        }
        .header h1 { font-size: 15px; color: white; margin-bottom: 6px;}
        
        .tabs {
            display: flex;
            gap: 4px;
            background: rgba(0,0,0,0.2);
            padding: 3px;
            border-radius: 6px;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            color: #dfe6e9;
            border: none;
            padding: 5px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active { background: #fdcb6e; color: #2d3436; }

        /* --- AREA KONTEN DINAMIS --- */
        .content-area {
            padding: 6px 10px;
            background: #353b48;
            flex-shrink: 0;
            border-bottom: 1px solid #2f3640;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 70px;
        }

        .question-box {
            background: #ffeaa7;
            color: #2d3436;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            border-left: 3px solid #fdcb6e;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .question-box span { color: #d63031; font-weight: 800; }

        .form-row {
            display: flex;
            align-items: flex-end;
            gap: 5px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .control-group label {
            font-size: 9px; color: #b2bec3; font-weight: 700;
            margin-bottom: 1px; text-transform: uppercase;
        }
        .control-group input, .control-group select {
            padding: 4px; border-radius: 4px; border: none;
            font-size: 12px; font-weight: bold; background: #f5f6fa;
            color: #2f3640; outline: none; width: 100%; text-align: center;
        }

        .btn-mini {
            background: #00b894; color: white; border: none;
            padding: 0 8px; border-radius: 4px; font-size: 11px;
            font-weight: bold; cursor: pointer; height: 24px;
            white-space: nowrap;
        }
        .btn-mini:active { background: #55efc4; }
        .btn-check { background: #e17055; }
        .btn-check:active { background: #d63031; }

        /* --- AREA TERMOMETER --- */
        .thermometer-container {
            flex: 1;
            display: flex;
            justify-content: center;
            position: relative;
            background: #2d3436;
            padding: 10px 20px;
            min-height: 0;
        }

        .thermometer-wrapper { 
            position: relative; 
            height: 100%; 
            display: flex; 
            align-items: center;
            margin-left: 30px; 
        }

        .thermometer-tube {
            width: 12px; height: 100%; background: #636e72;
            border-radius: 6px; position: relative;
        }

        .zero-line {
            position: absolute; top: 50%; left: -15px; right: -15px;
            height: 2px; background: #fdcb6e; z-index: 2;
        }

        .tick-mark {
            position: absolute; right: 0; width: 10px; height: 1px;
            background: #b2bec3; transform: translateY(50%);
        }
        .tick-mark.major { width: 20px; height: 2px; background: white; }
        
        .tick-label {
            position: absolute; left: 20px; transform: translateY(50%);
            font-size: 12px; color: #b2bec3; font-weight: bold; line-height: 1;
        }
        .tick-label.zero { color: #fdcb6e; font-size: 14px; font-weight: 800; }

        .hide-labels .tick-label { visibility: hidden; }

        /* --- KNOB PANAH & LABEL LANGKAH --- */
        .slider-arrow {
            position: absolute; 
            left: -10px; 
            width: 0; 
            height: 0; 
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 12px solid #fdcb6e; /* Panah Netral (Kuning) */
            transform: translate(-50%, 50%);
            cursor: grab; 
            z-index: 10;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.5));
        }
        
        .step-label {
            position: absolute;
            left: -50px;
            transform: translateY(50%);
            color: white;
            font-size: 12px;
            font-weight: 800;
            text-align: right;
            width: 45px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            z-index: 11;
        }

        .slider-arrow.locked { cursor: not-allowed; border-left-color: #636e72; }
        
        /* --- JEJAK LANGKAH (HISTORY) --- */
        .step-marker {
            position: absolute; 
            right: -15px; 
            width: 15px; 
            height: 4px;
            transform: translateY(50%);
            border-radius: 2px;
            z-index: 5;
        }
        /* Warna jejak berdasarkan arah gerak */
        .marker-naik { background: #ff7675; } /* Merah untuk Naik (+) */
        .marker-turun { background: #74b9ff; } /* Biru untuk Turun (-) */

        /* --- FLOATING RESULT (Hasil di Kanan Tangga) --- */
        .floating-result {
            position: absolute;
            right: 20px; 
            top: 50%;
            transform: translateY(-50%);
            text-align: left;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .float-item {
            font-size: 12px;
            color: #b2bec3;
        }
        .float-item span {
            display: block;
            font-size: 20px;
            font-weight: 800;
        }
        .text-minus { color: #74b9ff; }
        .text-plus { color: #ff7675; }
        .text-neutral { color: #fdcb6e; }

    </style>
</head>
<body>

<div class="app-container">
    
    <div class="header">
        <h1>🌡️ Lab Bilangan Bulat</h1>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchMode(1)">1. Eksplorasi</button>
            <button class="tab-btn" onclick="switchMode(2)">2. Prediksi</button>
            <button class="tab-btn" onclick="switchMode(3)">3. Soal</button>
            <button class="tab-btn" onclick="switchMode(4)">4. Misteri</button>
        </div>
    </div>

    <div class="content-area" id="contentArea">
        <!-- Diisi via JavaScript -->
    </div>

    <div class="thermometer-container">
        <div class="floating-result" id="floatingResult">
            <div class="float-item">Awal: <span id="displayStart" class="text-neutral">0°</span></div>
            <div class="float-item">Operasi: <span id="displayChange" class="text-neutral">-</span></div>
            <div class="float-item">Akhir: <span id="displayEnd" class="text-neutral">0°</span></div>
        </div>

        <div class="thermometer-wrapper">
            <div class="thermometer-tube" id="track">
                <div class="zero-line"></div>
                <div class="slider-arrow" id="knob"></div>
                <div class="step-label" id="stepLabel">0</div>
            </div>
        </div>
    </div>

</div>

<script>
    const MIN_VAL = -10;
    const MAX_VAL = 10;
    const RANGE = MAX_VAL - MIN_VAL;
    
    const track = document.getElementById('track');
    const knob = document.getElementById('knob');
    const stepLabel = document.getElementById('stepLabel');
    const contentArea = document.getElementById('contentArea');

    let currentMode = 1;
    let currentValue = 0;
    let isDragging = false;
    let isAnimating = false;
    
    let activeStartPos = 0; 

    let mode2Start = 0, mode2Target = 0, mode2Op = '+', mode2Step = 0;

    function initTicks() {
        document.querySelectorAll('.tick-mark, .tick-label').forEach(el => el.remove());
        for (let i = 0; i <= RANGE; i++) {
            const val = MIN_VAL + i;
            const percent = (i / RANGE) * 100;

            const tick = document.createElement('div');
            tick.className = 'tick-mark' + (val % 5 === 0 ? ' major' : '');
            tick.style.bottom = percent + '%';
            track.appendChild(tick);

            const label = document.createElement('div');
            label.className = 'tick-label';
            if (val === 0) label.classList.add('zero');
            label.innerText = val > 0 ? "+" + val : val;
            label.style.bottom = percent + '%';
            track.appendChild(label);
        }
    }

    function updateVisual(value, animate = true) {
        const percent = ((value - MIN_VAL) / RANGE) * 100;
        
        knob.style.bottom = percent + '%';
        stepLabel.style.bottom = percent + '%';
        
        // Logika Label Langkah
        if (currentMode === 4 && isAnimating === false && !isDragging) {
            stepLabel.innerText = "?";
        } else {
            let steps = Math.abs(value - activeStartPos);
            if (steps === 0) {
                stepLabel.innerText = "0";
            } else {
                let arrow = value > activeStartPos ? "▲" : "▼";
                stepLabel.innerText = steps + " " + arrow;
            }
        }

        // Warna Panah selalu Netral (Kuning)
        knob.style.borderLeftColor = '#fdcb6e';

        // Update Text Mengambang di Kanan
        if (currentMode !== 4) {
            document.getElementById('displayEnd').innerText = (value > 0 ? "+" : "") + value + "°";
            document.getElementById('displayEnd').className = 
                (value < 0 ? 'text-minus' : (value > 0 ? 'text-plus' : 'text-neutral'));
        }
    }

    function getValueFromY(clientY) {
        const rect = track.getBoundingClientRect();
        let y = clientY - rect.top;
        y = Math.max(0, Math.min(y, rect.height)); 
        const percentFromTop = y / rect.height;
        const percentFromBottom = 1 - percentFromTop;
        let value = MIN_VAL + (percentFromBottom * RANGE);
        return Math.round(value);
    }

    function startDrag(e) {
        if (currentMode === 4 || isAnimating) return; 
        isDragging = true;
    }

    function onDrag(e) {
        if (!isDragging) return;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        currentValue = getValueFromY(clientY);
        updateVisual(currentValue, false);
    }

    function endDrag() { 
        if (!isDragging) return;
        isDragging = false;
    }

    knob.addEventListener('mousedown', startDrag);
    knob.addEventListener('touchstart', startDrag, {passive: true});
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('touchmove', onDrag, {passive: false});
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchend', endDrag);

    function switchMode(mode) {
        currentMode = mode;
        isAnimating = false;
        activeStartPos = 0; 
        
        document.querySelectorAll('.tab-btn').forEach((btn, index) => {
            btn.classList.toggle('active', index + 1 === mode);
        });

        document.querySelectorAll('.step-marker').forEach(el => el.remove());
        
        track.classList.remove('hide-labels');
        knob.classList.remove('locked');
        currentValue = 0;
        
        document.getElementById('displayStart').innerText = "0°";
        document.getElementById('displayChange').innerText = "-";
        document.getElementById('displayEnd').innerText = "0°";

        if (mode === 1) {
            contentArea.innerHTML = `
                <div class="form-row">
                    <div class="control-group"><label>Awal</label><input type="number" id="m1Start" value="-5" min="-10" max="10"></div>
                    <div class="control-group"><label>Op</label>
                        <select id="m1Op"><option value="+">+</option><option value="-">-</option></select>
                    </div>
                    <div class="control-group"><label>Langkah</label><input type="number" id="m1Step" value="3" min="1" max="10"></div>
                    <button class="btn-mini" onclick="runMode1()">GO</button>
                </div>
            `;
        } 
        else if (mode === 2) {
            mode2Start = Math.floor(Math.random() * 9) - 4; 
            mode2Step = Math.floor(Math.random() * 4) + 2;   
            mode2Op = Math.random() > 0.5 ? '+' : '-';
            mode2Target = mode2Op === '+' ? mode2Start + mode2Step : mode2Start - mode2Step;

            activeStartPos = mode2Start; 

            contentArea.innerHTML = `
                <div class="question-box">
                    Awal: <span>${mode2Start}</span>. Operasi: <span>${mode2Op} ${mode2Step}</span>.<br>
                    Geser panah dan ketik hasil akhirnya!
                </div>
                <div class="form-row">
                    <div class="control-group" style="flex:2;">
                        <label>Hasil Akhir</label>
                        <input type="number" id="m2Answer" placeholder="?">
                    </div>
                    <button class="btn-mini btn-check" style="width:60px;" onclick="checkMode2()">Cek</button>
                </div>
            `;
            document.getElementById('displayStart').innerText = mode2Start + "°";
            document.getElementById('displayChange').innerText = mode2Op + mode2Step + "°";
            document.getElementById('displayEnd').innerText = "?";
            
            currentValue = mode2Start;
            updateVisual(currentValue);
        }
        else if (mode === 3) {
            const start = Math.floor(Math.random() * 8) - 8;
            const change = Math.floor(Math.random() * 7) + 2;
            const isPlus = Math.random() > 0.5;
            const opText = isPlus ? "naik" : "turun";
            const opSymbol = isPlus ? "+" : "-";
            
            activeStartPos = start; 

            contentArea.innerHTML = `
                <div class="question-box">
                    Suhu awal di suatu kota <span>${start}°C</span>. Suhu ${opText} <span>${change}°C</span>.<br>
                    Geser panah dan ketik hasil akhir!
                </div>
                <div class="form-row">
                    <div class="control-group" style="flex:2;">
                        <label>Suhu Akhir (°C)</label>
                        <input type="number" id="m3Answer" placeholder="?">
                    </div>
                    <button class="btn-mini btn-check" style="width:60px;" onclick="checkMode3(${start}, '${opSymbol}', ${change})">Cek</button>
                </div>
            `;
            document.getElementById('displayStart').innerText = start + "°";
            document.getElementById('displayChange').innerText = opSymbol + change + "°";
            document.getElementById('displayEnd').innerText = "?";
            
            currentValue = start;
            updateVisual(currentValue);
        }
        else if (mode === 4) {
            track.classList.add('hide-labels');
            knob.classList.add('locked');
            
            const startPos = Math.floor(Math.random() * 8) - 8; 
            const move = Math.floor(Math.random() * 8) + 3;
            const endPos = Math.min(startPos + move, MAX_VAL); 
            
            activeStartPos = startPos; 

            contentArea.innerHTML = `
                <div class="question-box">
                    Posisi awal: <span>${startPos}</span>. Ujung panah di angka berapa?<br>
                    <i>(Label angka disembunyikan)</i>
                </div>
                <div class="form-row">
                    <div class="control-group" style="flex:2;">
                        <label>Tebak Angka</label>
                        <input type="number" id="m4Answer" placeholder="?">
                    </div>
                    <button class="btn-mini btn-check" style="width:60px;" onclick="checkMode4(${startPos}, ${endPos})">Cek</button>
                </div>
            `;
            document.getElementById('displayStart').innerText = startPos + "°";
            document.getElementById('displayChange').innerText = "+" + move + "°";
            document.getElementById('displayEnd').innerText = "?";
            
            currentValue = endPos;
            updateVisual(endPos);
        }
    }

    function runMode1() {
        if (isAnimating) return;

        const start = parseInt(document.getElementById('m1Start').value) || 0;
        const op = document.getElementById('m1Op').value;
        const step = parseInt(document.getElementById('m1Step').value) || 0;

        let validStart = Math.max(MIN_VAL, Math.min(start, MAX_VAL));
        activeStartPos = validStart; 
        
        let endValue = op === '+' ? validStart + step : validStart - step;
        endValue = Math.max(MIN_VAL, Math.min(endValue, MAX_VAL));

        document.getElementById('displayStart').innerText = validStart + "°";
        document.getElementById('displayChange').innerText = op + step + "°";

        // Bersihkan marker lama HANYA saat GO ditekan
        document.querySelectorAll('.step-marker').forEach(el => el.remove());

        // --- MEMBUAT TANDA DI POSISI AWAL ---
        const startPercent = ((validStart - MIN_VAL) / RANGE) * 100;
        const startMarker = document.createElement('div');
        
        // Warna titik awal: biru jika minus, merah jika plus (netral jika 0)
        if (validStart < 0) startMarker.className = 'step-marker marker-turun'; 
        else if (validStart > 0) startMarker.className = 'step-marker marker-naik';
        else startMarker.className = 'step-marker';
        
        startMarker.style.bottom = startPercent + '%';
        track.appendChild(startMarker);

        updateVisual(validStart);
        currentValue = validStart;

        const direction = op === '+' ? 1 : -1;
        const totalSteps = Math.abs(endValue - validStart);

        if (totalSteps === 0) return;

        isAnimating = true;
        let stepCount = 0;
        
        const interval = setInterval(() => {
            stepCount++;
            currentValue += direction;
            updateVisual(currentValue);

            const percent = ((currentValue - MIN_VAL) / RANGE) * 100;
            const marker = document.createElement('div');
            
            // Jejak pergerakan: Naik = Merah, Turun = Biru
            if (direction === 1) {
                marker.className = 'step-marker marker-naik'; 
            } else {
                marker.className = 'step-marker marker-turun'; 
            }
            
            marker.style.bottom = percent + '%';
            track.appendChild(marker);

            if (stepCount >= totalSteps) {
                clearInterval(interval);
                isAnimating = false;
            }
        }, 800); 
    }

    function checkMode2() {
        const ans = parseInt(document.getElementById('m2Answer').value);
        if (ans === mode2Target) {
            alert("Benar! Jawaban kamu tepat.");
            switchMode(2); 
        } else {
            alert("Salah. Coba hitung ulang dan geser panah dengan tepat.");
        }
    }

    function checkMode3(start, op, change) {
        let expected = op === '+' ? start + change : start - change;
        const ans = parseInt(document.getElementById('m3Answer').value);
        if (ans === expected) {
            alert("Benar! Suhu akhirnya adalah " + expected + "°C.");
            switchMode(3); 
        } else {
            alert("Salah. Ingat, " + start + " " + op + " " + change + " = ?");
        }
    }

    function checkMode4(start, end) {
        const ans = parseInt(document.getElementById('m4Answer').value);
        if (ans === end) {
            alert("Tepat! Jawabannya adalah " + end + ".");
            switchMode(4); 
        } else {
            alert("Salah. Coba hitung jarak dari " + start + " sejauh panah yang ditunjukkan.");
        }
    }

    initTicks();
    switchMode(1);
</script>
</body>
</html>

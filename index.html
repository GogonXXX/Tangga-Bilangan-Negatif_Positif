<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lab Bilangan Bulat - Mobile</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: #1e272e;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 8px;
            color: white;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .app-container {
            background: #2d3436;
            width: 100%;
            max-width: 480px;
            min-height: calc(100dvh - 16px);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: visible;
        }

        /* --- HEADER & TABS --- */
        .header {
            background: #0984e3;
            padding: 10px;
            text-align: center;
            flex-shrink: 0;
            z-index: 20;
            border-radius: 16px 16px 0 0;
            position: sticky;
            top: 0;
        }
        .header h1 { font-size: 16px; color: white; margin-bottom: 8px;}
        
        .tabs {
            display: flex;
            gap: 4px;
            background: rgba(0,0,0,0.2);
            padding: 3px;
            border-radius: 6px;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            color: #dfe6e9;
            border: none;
            padding: 6px 0;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active { background: #fdcb6e; color: #2d3436; }

        /* --- LAYOUT UTAMA --- */
        .main-layout {
            flex: 1;
            display: flex;
            flex-direction: row;
            background: #2d3436;
            overflow: visible;
            padding: 12px 8px 12px 10px;
            gap: 8px;
        }

        /* --- PANEL KIRI --- */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 265px;
            flex-shrink: 0;
        }

        .question-box {
            background: #ffeaa7;
            color: #2d3436;
            padding: 9px 11px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            text-align: left;
            border-left: 4px solid #fdcb6e;
            line-height: 1.4;
            display: none; 
            flex-shrink: 0;
        }
        .question-box span { color: #d63031; font-weight: 800; }
        .question-box small { display: block; margin-top: 4px; }

        /* --- JAM --- */
        .clock-container {
            display: none;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            margin-top: 0;
            margin-bottom: 4px;
        }
        
        .clock-face {
            width: 262px;
            height: 262px;
            background: #f5f6fa;
            border-radius: 50%;
            border: 11px solid #2c3e50;
            position: relative;
            box-shadow: 0 10px 28px rgba(0,0,0,0.4);
            cursor: grab;
        }
        .clock-face:active { cursor: grabbing; }

        .clock-number {
            position: absolute;
            font-size: 20px;
            font-weight: 800;
            color: #2d3436;
            text-align: center;
            width: 38px;
            height: 38px;
            line-height: 38px;
            top: 50%;
            left: 50%;
            margin-top: -19px;
            margin-left: -19px;
        }

        .clock-tick {
            position: absolute;
            width: 3.6px;
            height: 10px;
            background: #b2bec3;
            top: 11px;
            left: 50%;
            margin-left: -1.8px;
            transform-origin: 50% 120px;
        }
        .clock-tick.major {
            height: 16px;
            width: 5.5px;
            background: #2d3436;
            margin-left: -2.75px;
            top: 10px;
            transform-origin: 50% 121px;
        }

        .clock-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 19px;
            height: 19px;
            background: #d63031;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
            z-index: 5;
            cursor: grab;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hand:active { cursor: grabbing; }
        
        .hand.hour   { width: 9.6px; height: 66px; margin-left: -4.8px; background: #2d3436; }
        .hand.minute { width: 7.4px; height: 94px; margin-left: -3.7px; background: #0984e3; }
        .hand.second { width: 3.6px; height: 113px; margin-left: -1.8px; background: #d63031; }

        /* --- 4 TOMBOL KONTROL --- */
        .clock-controls {
            display: none;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 3px;
            width: 100%;
            flex-shrink: 0;
            margin-bottom: 4px;
        }
        .clock-controls .mini-group {
            display: flex;
            flex-direction: column;
        }
        .clock-controls .mini-group label {
            font-size: 8px;
            color: #b2bec3;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 1px;
            text-align: center;
        }
        .clock-controls input,
        .clock-controls select,
        .clock-controls button {
            padding: 3px;
            border-radius: 4px;
            border: none;
            font-size: 11px;
            font-weight: bold;
            background: #f5f6fa;
            color: #2f3640;
            outline: none;
            width: 100%;
            text-align: center;
            height: 24px;
        }
        .clock-controls button {
            background: #00b894;
            color: white;
            cursor: pointer;
        }
        .clock-controls button:active { background: #55efc4; }
        .clock-controls button:disabled { background: #636e72; cursor: not-allowed; }
        .clock-controls select { padding: 2px; font-size: 10px; }

        /* --- KONTROL MODE 1 --- */
        .floating-controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            flex-shrink: 0;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }
        .control-group label {
            font-size: 9px; color: #b2bec3; font-weight: 700;
            margin-bottom: 1px; text-transform: uppercase;
        }
        .control-group input, .control-group select {
            padding: 5px; border-radius: 4px; border: none;
            font-size: 12px; font-weight: bold; background: #f5f6fa;
            color: #2f3640; outline: none; width: 100%; text-align: center;
        }
        .btn-mini {
            background: #00b894; color: white; border: none;
            padding: 0 8px; border-radius: 4px; font-size: 11px;
            font-weight: bold; cursor: pointer; height: 26px;
            white-space: nowrap; width: 100%;
            margin-top: 2px;
        }
        .btn-mini:active { background: #55efc4; }
        .btn-check { background: #e17055; }
        .btn-check:active { background: #d63031; }

        /* --- AREA JAWABAN --- */
        .answer-area {
            display: none;
            width: 100%;
            margin-top: 4px;
        }
        .answer-area .control-group label { color: #ffeaa7; }

        /* --- AREA TENGAH: TERMOMETER --- */
        .thermometer-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: stretch;
            position: relative;
            padding: 10px 0;
            min-height: 420px;
            min-width: 120px;
        }

        .thermometer-wrapper { 
            position: relative; 
            height: 100%;
            min-height: 400px;
            display: flex; 
            align-items: center;
            padding-left: 50px;
        }

        .thermometer-tube {
            width: 24px; 
            height: 100%;
            min-height: 380px;
            background: #636e72;
            border-radius: 12px; 
            position: relative;
            border: 2px solid #444;
        }

        .thermometer-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, 
                #0984e3 0%,      
                #6c5ce7 50%,     
                #d63031 100%     
            );
            background-size: 100% 1000%; 
            background-position: bottom;
            z-index: 1;
            transition: height 0.8s ease;
            border-radius: 0 0 10px 10px; 
        }

        .zero-line {
            position: absolute; top: 50%; left: -15px; right: -15px;
            height: 2px; background: rgba(255,255,255,0.7); z-index: 2;
        }

        .tick-container {
            position: absolute;
            left: 35px; 
            transform: translateY(50%);
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 5;
        }
        .tick-label {
            font-size: 12px; color: #b2bec3; font-weight: bold; line-height: 1;
        }
        .tick-label.zero { color: #fdcb6e; font-size: 14px; font-weight: 800; }

        .white-arrow {
            font-size: 12px;
            color: white;
            opacity: 0;
            transition: opacity 0.2s;
            text-shadow: 0 0 4px rgba(0,0,0,0.8);
        }
        .white-arrow.active { opacity: 1; }

        .hide-labels .tick-label { visibility: hidden; }

        .slider-arrow {
            position: absolute; 
            left: -15px; 
            width: 0; 
            height: 0; 
            border-top: 12px solid transparent;   
            border-bottom: 12px solid transparent;
            border-left: 18px solid #fdcb6e;      
            transform: translate(-50%, 50%);
            cursor: grab; 
            z-index: 10; 
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.5));
        }
        
        .step-label {
            position: absolute;
            left: -65px; 
            transform: translateY(50%);
            color: white;
            font-size: 13px;
            font-weight: 800;
            text-align: right;
            width: 35px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            z-index: 11;
        }

        .slider-arrow.locked { cursor: not-allowed; border-left-color: #636e72; }
        
        .step-marker {
            position: absolute; 
            left: 50%; 
            width: 16px; 
            height: 6px;
            transform: translate(-50%, 50%);
            border-radius: 3px;
            z-index: 3; 
            border: 1px solid rgba(0,0,0,0.4);
        }
        
        .marker-start { background: #fdcb6e; } 
        .marker-naik { background: #d63031; } 
        .marker-turun { background: #0984e3; } 

        /* --- FLOATING RESULT: pojok kiri bawah, sejajar ujung bawah termometer --- */
        .floating-result {
            position: absolute;
            left: 0;
            bottom: 0;
            text-align: left;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 20;
            background: rgba(45,52,54,0.85);
            padding: 6px 8px;
            border-radius: 6px;
        }
        .float-item { font-size: 10px; color: #b2bec3; }
        .float-item span { display: block; font-size: 16px; font-weight: 800; }
        
        .text-orange { color: #e67e22; } 
        .text-red { color: #ff7675; } 
        .text-blue { color: #74b9ff; } 
        .text-white { color: #ffffff; } 

    </style>
</head>
<body>

<div class="app-container">
    
    <div class="header">
        <h1>🌡️ Lab Bilangan Bulat</h1>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchMode(1)">1. Eksplorasi</button>
            <button class="tab-btn" onclick="switchMode(2)">2. Soal</button>
            <button class="tab-btn" onclick="switchMode(3)">3. Prediksi</button>
            <button class="tab-btn" onclick="switchMode(4)">4. Misteri</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="left-panel">
            <div class="question-box" id="questionBox"></div>
            
            <div class="clock-container" id="clockContainer">
                <div class="clock-face" id="clockFace">
                    <div class="hand hour" id="hourHand"></div>
                    <div class="hand minute" id="minuteHand"></div>
                    <div class="hand second" id="secondHand"></div>
                    <div class="clock-center"></div>
                </div>
            </div>

            <div class="clock-controls" id="clockControls">
                <div class="mini-group">
                    <label>Awal</label>
                    <input type="number" id="ccStartHour" value="8" min="0" max="23">
                </div>
                <div class="mini-group">
                    <label>Akhir</label>
                    <input type="number" id="ccEndHour" value="11" min="0" max="23">
                </div>
                <div class="mini-group">
                    <label>Satuan</label>
                    <select id="ccUnit">
                        <option value="jam">Jam</option>
                        <option value="menit">Menit</option>
                        <option value="detik">Detik</option>
                    </select>
                </div>
                <div class="mini-group">
                    <label>&nbsp;</label>
                    <button id="btnGo" onclick="runClockMode()">GO</button>
                </div>
            </div>

            <div class="answer-area" id="answerArea">
                <div class="control-group">
                    <label id="answerLabel">Suhu Akhir (°C)</label>
                    <input type="number" id="mainAnswer" placeholder="?">
                </div>
                <button class="btn-mini btn-check" onclick="checkMainAnswer()">Cek</button>
            </div>

            <div class="floating-controls" id="leftMenu"></div>
        </div>

        <div class="thermometer-container">
            <!-- Floating result dipindah ke kiri bawah -->
            <div class="floating-result" id="floatingResult">
                <div class="float-item">Awal: <span id="displayStart" class="text-orange">0°</span></div>
                <div class="float-item">Operasi: <span id="displayChange" class="text-white">-</span></div>
                <div class="float-item">Akhir: <span id="displayEnd" class="text-white">0°</span></div>
            </div>

            <div class="thermometer-wrapper">
                <div class="thermometer-tube" id="track">
                    <div class="thermometer-fill" id="fill"></div>
                    <div class="zero-line"></div>
                    
                    <div class="slider-arrow" id="knob"></div>
                    <div class="step-label" id="stepLabel">0</div>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    const MIN_VAL = -10;
    const MAX_VAL = 10;
    const RANGE = MAX_VAL - MIN_VAL;
    
    const track = document.getElementById('track');
    const fill = document.getElementById('fill');
    const knob = document.getElementById('knob');
    const stepLabel = document.getElementById('stepLabel');
    const leftMenu = document.getElementById('leftMenu');
    const questionBox = document.getElementById('questionBox');
    const answerArea = document.getElementById('answerArea');
    const answerLabel = document.getElementById('answerLabel');
    const mainAnswer = document.getElementById('mainAnswer');
    
    const clockContainer = document.getElementById('clockContainer');
    const clockControls = document.getElementById('clockControls');
    const clockFace = document.getElementById('clockFace');
    const hourHand = document.getElementById('hourHand');
    const minuteHand = document.getElementById('minuteHand');
    const secondHand = document.getElementById('secondHand');
    const btnGo = document.getElementById('btnGo');

    let currentMode = 1;
    let currentValue = 0;
    let isDragging = false;
    let isAnimating = false;
    
    let activeStartPos = 0; 
    let expectedAnswer = 0;
    
    let whiteArrows = {}; 

    let mode3 = {
        startHour: 8,
        endHour: 11,
        rate: 1,
        startTemp: -2,
        sign: 1,
        currentHour: 8,
        unit: 'jam',
        active: false
    };

    let animTimer = null;

    function hourToAngleUnwrapped(h) {
        return h * 30;
    }

    function formatJam(h) {
        return String(h).padStart(2, '0') + ".00";
    }

    function runClockMode() {
        if (currentMode !== 3) return;
        if (isAnimating) return;

        const sh = parseInt(document.getElementById('ccStartHour').value);
        const eh = parseInt(document.getElementById('ccEndHour').value);
        const unit = document.getElementById('ccUnit').value;

        if (isNaN(sh) || isNaN(eh)) {
            alert("Isi Awal dan Akhir pukul terlebih dahulu.");
            return;
        }
        if (sh < 0 || sh > 23 || eh < 0 || eh > 23) {
            alert("Jam harus antara 0 dan 23 (format Indonesia).");
            return;
        }
        if (eh === sh) {
            alert("Awal dan Akhir pukul tidak boleh sama.");
            return;
        }
        if (eh < sh) {
            alert("Akhir pukul harus lebih besar dari Awal pukul.");
            return;
        }

        const duration = eh - sh;
        const rate = mode3.rate;
        const sign = mode3.sign;

        let endTemp = mode3.startTemp + (rate * duration * sign);
        if (endTemp > MAX_VAL) {
            mode3.startTemp = MAX_VAL - (rate * duration * sign);
            endTemp = MAX_VAL;
        }
        if (endTemp < MIN_VAL) {
            mode3.startTemp = MIN_VAL - (rate * duration * sign);
            endTemp = MIN_VAL;
        }

        mode3.startHour = sh;
        mode3.endHour = eh;
        mode3.unit = unit;
        mode3.currentHour = sh;
        mode3.active = true;

        activeStartPos = mode3.startTemp;
        expectedAnswer = endTemp;

        hourHand.style.transition = 'none';
        minuteHand.style.transition = 'none';
        secondHand.style.transition = 'none';
        hourHand.style.transform   = `rotate(${hourToAngleUnwrapped(sh)}deg)`;
        minuteHand.style.transform = `rotate(0deg)`;
        secondHand.style.transform = `rotate(0deg)`;
        void hourHand.offsetWidth;
        hourHand.style.transition   = 'transform 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
        minuteHand.style.transition = 'transform 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
        secondHand.style.transition = 'transform 0.8s cubic-bezier(0.4, 0, 0.2, 1)';

        const arah = sign > 0 ? "naik" : "turun";
        const jamAwal  = formatJam(sh);
        const jamAkhir = formatJam(eh);
        questionBox.style.display = 'block';
        questionBox.innerHTML =
            `Pada pukul <span>${jamAwal}</span> suhu <span>${mode3.startTemp}°C</span>.<br>` +
            `Setiap <span>1 ${unit}</span> suhu <span>${arah} ${rate}°C</span>.<br>` +
            `Berapa suhu pada pukul <span>${jamAkhir}</span>?`;

        document.getElementById('displayStart').innerText = mode3.startTemp + "°";
        document.getElementById('displayStart').className = 'text-orange';
        document.getElementById('displayChange').innerText =
            (sign > 0 ? "+" : "-") + (rate * duration) + "°";
        document.getElementById('displayChange').className =
            sign > 0 ? 'text-red' : 'text-blue';
        document.getElementById('displayEnd').innerText = "?";

        answerArea.style.display = 'block';
        answerLabel.innerText = 'Suhu Akhir (°C)';
        mainAnswer.value = '';

        currentValue = mode3.startTemp;
        updateVisual(mode3.startTemp);

        animateClock(sh, eh, unit, duration, rate, sign);
    }

    function animateClock(startH, endH, unit, duration, rate, sign) {
        isAnimating = true;
        btnGo.disabled = true;
        btnGo.innerText = '...';

        const startTemp = mode3.startTemp;
        const stepDuration = 1400;

        let visualSteps;
        if (unit === 'jam') {
            visualSteps = duration;
        } else if (unit === 'menit') {
            visualSteps = Math.min(duration * 60, 12);
        } else {
            visualSteps = Math.min(duration * 3600, 12);
        }

        const startHourAngle = hourToAngleUnwrapped(startH);
        const endHourAngle = hourToAngleUnwrapped(endH);

        let step = 0;

        animTimer = setInterval(() => {
            step++;
            const progress = step / visualSteps;

            if (unit === 'jam') {
                const currentHourAngle = startHourAngle + step * 30;
                hourHand.style.transform = `rotate(${currentHourAngle}deg)`;
                minuteHand.style.transform = `rotate(0deg)`;
                secondHand.style.transform = `rotate(0deg)`;
            } else if (unit === 'menit') {
                const totalMinutes = duration * 60;
                const currentMinute = progress * totalMinutes;
                const angleMinute = currentMinute * 6;
                minuteHand.style.transform = `rotate(${angleMinute}deg)`;
                const hourAngle = startHourAngle + progress * (endHourAngle - startHourAngle);
                hourHand.style.transform = `rotate(${hourAngle}deg)`;
                secondHand.style.transform = `rotate(0deg)`;
            } else if (unit === 'detik') {
                const totalSeconds = duration * 3600;
                const currentSecond = progress * totalSeconds;
                const angleSecond = currentSecond * 6;
                secondHand.style.transform = `rotate(${angleSecond}deg)`;
                const minuteProg = currentSecond / 60;
                minuteHand.style.transform = `rotate(${minuteProg * 6}deg)`;
                const hourAngle = startHourAngle + progress * (endHourAngle - startHourAngle);
                hourHand.style.transform = `rotate(${hourAngle}deg)`;
            }

            const newTemp = startTemp + (rate * progress * duration * sign);
            const clamped = Math.max(MIN_VAL, Math.min(newTemp, MAX_VAL));
            currentValue = clamped;
            updateVisual(clamped);

            if (step >= visualSteps) {
                clearInterval(animTimer);
                animTimer = null;
                isAnimating = false;
                btnGo.disabled = false;
                btnGo.innerText = 'GO';

                hourHand.style.transform   = `rotate(${endHourAngle}deg)`;
                minuteHand.style.transform = `rotate(0deg)`;
                secondHand.style.transform = `rotate(0deg)`;

                currentValue = expectedAnswer;
                updateVisual(expectedAnswer);
            }
        }, stepDuration);
    }

    function initClock() {
        const toRemove = clockFace.querySelectorAll('.clock-number, .clock-tick');
        toRemove.forEach(el => el.remove());

        const centerPx  = 131;
        const radiusNum = 90;

        for (let i = 1; i <= 12; i++) {
            const angle = i * 30 * (Math.PI / 180);
            const x = centerPx + radiusNum * Math.sin(angle);
            const y = centerPx - radiusNum * Math.cos(angle);

            const numEl = document.createElement('div');
            numEl.className = 'clock-number';
            numEl.style.left = `${x}px`;
            numEl.style.top = `${y}px`;
            numEl.innerText = i;
            clockFace.appendChild(numEl);
        }

        for (let i = 0; i < 60; i++) {
            if (i % 5 === 0) continue;
            const tick = document.createElement('div');
            tick.className = 'clock-tick';
            tick.style.transform = `rotate(${i * 6}deg) translateY(0px)`;
            clockFace.appendChild(tick);
        }
        for (let i = 0; i < 12; i++) {
            const tick = document.createElement('div');
            tick.className = 'clock-tick major';
            tick.style.transform = `rotate(${i * 30}deg) translateY(0px)`;
            clockFace.appendChild(tick);
        }
    }

    let activeHand = null;
    function startHandDrag(e, handType) {
        if (isAnimating) return;
        e.preventDefault();
        e.stopPropagation();
        activeHand = handType;
        hourHand.style.transition = 'none';
        minuteHand.style.transition = 'none';
        secondHand.style.transition = 'none';
    }

    function onHandDrag(e) {
        if (!activeHand) return;
        
        const rect = clockFace.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const dx = clientX - centerX;
        const dy = clientY - centerY;
        
        let angle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
        if (angle < 0) angle += 360;

        if (activeHand === 'hour') {
            hourHand.style.transform = `rotate(${angle}deg)`;
            minuteHand.style.transform = `rotate(${angle * 12}deg)`;
        } else if (activeHand === 'minute') {
            minuteHand.style.transform = `rotate(${angle}deg)`;
        } else if (activeHand === 'second') {
            secondHand.style.transform = `rotate(${angle}deg)`;
        }
    }

    function endHandDrag() {
        if (!activeHand) return;
        activeHand = null;
        hourHand.style.transition = 'transform 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
        minuteHand.style.transition = 'transform 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
        secondHand.style.transition = 'transform 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
    }

    hourHand.addEventListener('mousedown', (e) => startHandDrag(e, 'hour'));
    hourHand.addEventListener('touchstart', (e) => startHandDrag(e, 'hour'), {passive: false});
    minuteHand.addEventListener('mousedown', (e) => startHandDrag(e, 'minute'));
    minuteHand.addEventListener('touchstart', (e) => startHandDrag(e, 'minute'), {passive: false});
    secondHand.addEventListener('mousedown', (e) => startHandDrag(e, 'second'));
    secondHand.addEventListener('touchstart', (e) => startHandDrag(e, 'second'), {passive: false});

    document.addEventListener('mousemove', onHandDrag);
    document.addEventListener('touchmove', onHandDrag, {passive: false});
    document.addEventListener('mouseup', endHandDrag);
    document.addEventListener('touchend', endHandDrag);

    function initTicks() {
        document.querySelectorAll('.tick-container').forEach(el => el.remove());
        whiteArrows = {}; 

        for (let i = 0; i <= RANGE; i++) {
            const val = MIN_VAL + i;
            const percent = (i / RANGE) * 100;

            const container = document.createElement('div');
            container.className = 'tick-container';
            container.style.bottom = percent + '%';

            const label = document.createElement('div');
            label.className = 'tick-label';
            if (val === 0) label.classList.add('zero');
            label.innerText = val > 0 ? "+" + val : val;
            container.appendChild(label);

            const arrow = document.createElement('div');
            arrow.className = 'white-arrow';
            arrow.innerText = '▲';
            container.appendChild(arrow);

            whiteArrows[val] = arrow;

            track.appendChild(container);
        }
    }

    function updateVisual(value, animate = true) {
        const percent = ((value - MIN_VAL) / RANGE) * 100;
        
        fill.style.height = percent + '%';

        if (percent > 0) {
            fill.style.backgroundSize = `100% ${(100 / (percent / 100))}%`;
            fill.style.backgroundPosition = 'bottom';
        }

        knob.style.bottom = percent + '%';
        stepLabel.style.bottom = percent + '%';
        
        for (let key in whiteArrows) {
            whiteArrows[key].classList.remove('active');
        }

        if (currentMode !== 4 && whiteArrows[value]) {
            whiteArrows[value].classList.add('active');
            
            let directionChar = '▲';
            if (value < activeStartPos) {
                directionChar = '▼';
            } else if (value === activeStartPos) {
                directionChar = '⬤'; 
            }
            whiteArrows[value].innerText = directionChar;
        }

        if (currentMode === 4 && isAnimating === false && !isDragging) {
            stepLabel.innerText = "?";
        } else {
            let steps = Math.abs(value - activeStartPos);
            stepLabel.innerText = steps === 0 ? "0" : steps;
        }

        if (currentMode !== 4) {
            document.getElementById('displayEnd').innerText = value + "°";
            document.getElementById('displayEnd').className = 'text-white';
        }
    }

    function getValueFromY(clientY) {
        const rect = track.getBoundingClientRect();
        let y = clientY - rect.top;
        y = Math.max(0, Math.min(y, rect.height)); 
        const percentFromTop = y / rect.height;
        const percentFromBottom = 1 - percentFromTop;
        let value = MIN_VAL + (percentFromBottom * RANGE);
        return Math.round(value);
    }

    function startDrag(e) {
        if (currentMode === 4 || isAnimating) return; 
        isDragging = true;
    }

    function onDrag(e) {
        if (!isDragging) return;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        currentValue = getValueFromY(clientY);
        updateVisual(currentValue, false);
    }

    function endDrag() { 
        if (!isDragging) return;
        isDragging = false;
    }

    knob.addEventListener('mousedown', startDrag);
    knob.addEventListener('touchstart', startDrag, {passive: true});
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('touchmove', onDrag, {passive: false});
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchend', endDrag);

    function switchMode(mode) {
        if (animTimer) { clearInterval(animTimer); animTimer = null; }
        isAnimating = false;
        if (btnGo) { btnGo.disabled = false; btnGo.innerText = 'GO'; }

        currentMode = mode;
        activeStartPos = 0; 
        mode3.active = false;
        
        document.querySelectorAll('.tab-btn').forEach((btn, index) => {
            btn.classList.toggle('active', index + 1 === mode);
        });

        document.querySelectorAll('.step-marker').forEach(el => el.remove());
        
        track.classList.remove('hide-labels');
        knob.classList.remove('locked');
        currentValue = 0;
        
        document.getElementById('displayStart').innerText = "0°";
        document.getElementById('displayStart').className = 'text-orange';
        document.getElementById('displayChange').innerText = "-";
        document.getElementById('displayChange').className = 'text-white';
        document.getElementById('displayEnd').innerText = "0°";
        document.getElementById('displayEnd').className = 'text-white';
        
        leftMenu.innerHTML = '';
        questionBox.style.display = 'none';
        answerArea.style.display = 'none';
        clockContainer.style.display = 'none'; 
        clockControls.style.display = 'none';
        
        hourHand.style.transform = 'rotate(0deg)';
        minuteHand.style.transform = 'rotate(0deg)';
        secondHand.style.transform = 'rotate(0deg)';

        if (mode === 1) {
            leftMenu.innerHTML = `
                <div class="control-group"><label>Awal</label><input type="number" id="m1Start" value="-5" min="-10" max="10"></div>
                <div class="control-group"><label>Op</label>
                    <select id="m1Op"><option value="+">+</option><option value="-">-</option></select>
                </div>
                <div class="control-group"><label>Langkah</label><input type="number" id="m1Step" value="3" min="1" max="15"></div>
                <button class="btn-mini" onclick="runMode1()">GO</button>
            `;
            currentValue = -5;
            updateVisual(-5);
        } 
        else if (mode === 2) {
            let start = Math.floor(Math.random() * 9) - 4; 
            let step = Math.floor(Math.random() * 4) + 2;   
            let op = Math.random() > 0.5 ? '+' : '-';
            let target = op === '+' ? start + step : start - step;
            
            if (target < -10) { target = -10; step = start - (-10); }
            if (target > 10) { target = 10; step = 10 - start; }

            activeStartPos = start; 
            expectedAnswer = target;

            questionBox.style.display = 'block';
            let opText = op === '+' ? "naik" : "turun";
            questionBox.innerHTML = `Jika suhu awal <span>${start}°C</span> dan suhu ${opText} <span>${step}°C</span>, maka berapa suhu akhirnya?`;
            
            document.getElementById('displayStart').innerText = start + "°";
            document.getElementById('displayStart').className = 'text-orange';
            
            document.getElementById('displayChange').innerText = step + "°";
            document.getElementById('displayChange').className = (op === '+') ? 'text-red' : 'text-blue';
            
            document.getElementById('displayEnd').innerText = "?";
            
            answerArea.style.display = 'block';
            answerLabel.innerText = 'Jawabanmu';
            mainAnswer.value = '';
            
            currentValue = start;
            updateVisual(currentValue);
        }
        else if (mode === 3) {
            clockContainer.style.display = 'flex';
            clockControls.style.display = 'grid';

            const startHour = Math.floor(Math.random() * 6) + 6;
            const duration  = Math.floor(Math.random() * 3) + 2;
            const endHour   = startHour + duration;
            const rate      = Math.floor(Math.random() * 2) + 1;
            const sign      = Math.random() > 0.5 ? 1 : -1;
            let startTemp   = Math.floor(Math.random() * 7) - 3;

            let endTemp = startTemp + (rate * duration * sign);
            if (endTemp > MAX_VAL) startTemp = MAX_VAL - (rate * duration * sign);
            if (endTemp < MIN_VAL) startTemp = MIN_VAL - (rate * duration * sign);
            endTemp = startTemp + (rate * duration * sign);

            mode3 = {
                startHour, endHour, rate, startTemp,
                sign, currentHour: startHour, unit: 'jam', active: true
            };

            document.getElementById('ccStartHour').value = startHour;
            document.getElementById('ccEndHour').value = endHour;
            document.getElementById('ccUnit').value = 'jam';

            activeStartPos = startTemp;
            expectedAnswer = endTemp;

            hourHand.style.transform   = `rotate(${hourToAngleUnwrapped(startHour)}deg)`;
            minuteHand.style.transform = `rotate(0deg)`;
            secondHand.style.transform = `rotate(0deg)`;

            questionBox.style.display = 'block';
            const arah = sign > 0 ? "naik" : "turun";
            const jamAwal  = formatJam(startHour);
            const jamAkhir = formatJam(endHour);
            questionBox.innerHTML =
                `Pada pukul <span>${jamAwal}</span> suhu <span>${startTemp}°C</span>.<br>` +
                `Setiap jam suhu <span>${arah} ${rate}°C</span>.<br>` +
                `Berapa suhu pada pukul <span>${jamAkhir}</span>?<br>` +
                `<small style="color:#0984e3;font-weight:700;">💡 Isi Awal & Akhir, pilih satuan, lalu klik GO</small>`;

            document.getElementById('displayStart').innerText = startTemp + "°";
            document.getElementById('displayStart').className = 'text-orange';
            document.getElementById('displayChange').innerText =
                (sign > 0 ? "+" : "-") + (rate * duration) + "°";
            document.getElementById('displayChange').className =
                sign > 0 ? 'text-red' : 'text-blue';
            document.getElementById('displayEnd').innerText = "?";

            answerArea.style.display = 'block';
            answerLabel.innerText = 'Suhu Akhir (°C)';
            mainAnswer.value = '';

            currentValue = startTemp;
            updateVisual(startTemp);
        }
        else if (mode === 4) {
            track.classList.add('hide-labels');
            knob.classList.add('locked');
            
            const startPos = Math.floor(Math.random() * 8) - 8; 
            const move = Math.floor(Math.random() * 8) + 3;
            const endPos = Math.min(startPos + move, MAX_VAL); 
            
            activeStartPos = startPos; 
            expectedAnswer = endPos;

            questionBox.style.display = 'block';
            questionBox.innerHTML = `Posisi awal: <span>${startPos}</span>.<br>Ujung panah di angka berapa?`;
            
            document.getElementById('displayStart').innerText = startPos + "°";
            document.getElementById('displayStart').className = 'text-orange';
            
            document.getElementById('displayChange').innerText = move + "°";
            document.getElementById('displayChange').className = 'text-red'; 
            
            document.getElementById('displayEnd').innerText = "?";
            
            answerArea.style.display = 'block';
            answerLabel.innerText = 'Tebak Angka';
            mainAnswer.value = '';
            
            currentValue = endPos;
            updateVisual(endPos);
        }
    }

    function runMode1() {
        if (isAnimating) return;

        const start = parseInt(document.getElementById('m1Start').value) || 0;
        const op = document.getElementById('m1Op').value;
        const step = parseInt(document.getElementById('m1Step').value) || 0;

        let validStart = Math.max(MIN_VAL, Math.min(start, MAX_VAL));
        activeStartPos = validStart; 
        
        let endValue = op === '+' ? validStart + step : validStart - step;
        endValue = Math.max(MIN_VAL, Math.min(endValue, MAX_VAL));

        document.getElementById('displayStart').innerText = validStart + "°";
        document.getElementById('displayStart').className = 'text-orange';
        
        document.getElementById('displayChange').innerText = step + "°";
        document.getElementById('displayChange').className = (op === '+') ? 'text-red' : 'text-blue';

        document.querySelectorAll('.step-marker').forEach(el => el.remove());

        const startPercent = ((validStart - MIN_VAL) / RANGE) * 100;
        const startMarker = document.createElement('div');
        startMarker.className = 'step-marker marker-start'; 
        startMarker.style.bottom = startPercent + '%';
        track.appendChild(startMarker);

        updateVisual(validStart);
        currentValue = validStart;

        const direction = op === '+' ? 1 : -1;
        const totalSteps = Math.abs(endValue - validStart);

        if (totalSteps === 0) return;

        isAnimating = true;
        let stepCount = 0;
        
        const interval = setInterval(() => {
            stepCount++;
            currentValue += direction;
            updateVisual(currentValue);

            const percent = ((currentValue - MIN_VAL) / RANGE) * 100;
            const marker = document.createElement('div');
            marker.className = 'step-marker';
            
            if (direction === 1) {
                marker.classList.add('marker-naik');
            } else {
                marker.classList.add('marker-turun');
            }
            
            marker.style.bottom = percent + '%';
            track.appendChild(marker);

            if (stepCount >= totalSteps) {
                clearInterval(interval);
                isAnimating = false;
            }
        }, 1000); 
    }

    function checkMainAnswer() {
        const ans = parseInt(mainAnswer.value);
        if (ans === expectedAnswer) {
            alert("Benar! Jawaban tepat.");
            setTimeout(() => switchMode(currentMode), 1000); 
        } else {
            alert("Salah. Coba hitung ulang dan geser panah dengan tepat.");
        }
    }

    initTicks();
    initClock();
    switchMode(1);
</script>
</body>
</html>
